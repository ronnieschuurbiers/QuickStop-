<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickStop!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#1b4332] flex flex-col items-center justify-between p-6 select-none">

  <!-- Header -->
  <header class="w-full text-center mt-2">
    <h1 class="text-4xl font-black text-white tracking-wide drop-shadow-lg">
      Quick<span class="text-yellow-300">Stop!</span>
    </h1>
    <p class="text-green-300 text-sm mt-1">Name something that starts with the letter</p>
  </header>

  <!-- Card area -->
  <main class="flex-1 flex flex-col items-center justify-center w-full">

    <!-- Pile wrapper – shadow cards are inserted here by JS -->
    <div id="pile-wrapper" class="relative flex items-center justify-center"
         style="width: 280px; height: 380px;">

      <!-- The actual card scene (3-D flip container) -->
      <div id="card-scene" class="card-scene absolute inset-0 cursor-pointer"
           style="width: 280px; height: 380px;">
        <div id="card" class="card-inner w-full h-full drop-shadow-2xl">

          <!-- Back face: letter -->
          <div class="card-face card-back-face border-4 border-white/20">
            <span class="text-[5rem] font-black leading-none drop-shadow-lg" id="card-letter">A</span>
            <span class="mt-3 text-white/70 text-sm font-bold uppercase tracking-widest">Quick Stop</span>
          </div>

          <!-- Front face: prompt -->
          <div class="card-face card-front-face border-4 border-red-300/40">
            <!-- Category label -->
            <div class="w-full bg-[#c1121f] rounded-xl py-2 px-4 text-center mb-6">
              <span class="text-white text-xs font-black uppercase tracking-widest">Category</span>
            </div>
            <!-- Prompt text -->
            <p class="text-2xl font-black text-gray-800 text-center leading-snug" id="card-prompt">
              Name an animal
            </p>
            <!-- Letter reminder -->
            <div class="mt-8 flex items-center justify-center w-16 h-16 rounded-full bg-[#c1121f] shadow-lg">
              <span class="text-white text-3xl font-black" id="card-letter-front"></span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Hint text -->
    <p id="hint" class="mt-8 text-green-300 text-sm font-bold animate-pulse">Tap to flip</p>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex-col items-center justify-center text-center px-6">
      <p class="text-6xl mb-4">🎉</p>
      <h2 class="text-3xl font-black text-white mb-2">That's all!</h2>
      <p class="text-green-300 mb-8">You went through the whole deck.</p>
      <button onclick="location.reload()"
              class="bg-yellow-300 text-gray-900 font-black text-lg px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition-transform">
        Play again
      </button>
    </div>

  </main>

  <!-- Footer: remaining cards -->
  <footer class="w-full text-center pb-2">
    <p class="text-green-400 text-sm">
      <span id="remaining">25</span> cards remaining
    </p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
