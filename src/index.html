<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOWGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
  </style>
</head>
<body class="h-[100dvh] bg-white flex flex-col items-center gap-2 px-4 pt-4 pb-4 select-none overflow-hidden">

  <!-- Header -->
  <header class="w-full text-center py-2">
    <h1 class="text-4xl tracking-wide drop-shadow-lg">
      <span class="font-bold text-[#f4c430]">SLOW</span><span class="font-black text-[#f4c430]">GO</span>
    </h1>
    <p class="text-blue-700 text-base mt-1">Name something that starts with the letter</p>
  </header>

  <!-- Card area -->
  <main class="flex flex-1 flex-col items-center justify-center w-full">

    <!-- Pile wrapper – shadow cards are inserted here by JS -->
    <div id="pile-wrapper" class="relative flex items-center justify-center"
         style="width: min(260px, 72vw); height: min(360px, 56vh);">

      <!-- The actual card scene (3-D flip container) -->
      <div id="card-scene" class="card-scene absolute inset-0 cursor-pointer drop-shadow-2xl" tabindex="0"
           style="width: min(260px, 72vw); height: min(360px, 56vh);">
        <div id="card" class="card-inner w-full h-full">

          <!-- Back face: letter -->
          <div class="card-face card-back-face relative overflow-hidden">
            <!-- Yellow section with clipped bottom-right corner -->
            <div class="card-yellow-area absolute inset-0">
              <span class="absolute top-4 left-4 text-white text-2xl font-black leading-none" id="card-letter-top-left"></span>
              <span class="absolute top-4 right-4 text-white text-2xl font-black leading-none" id="card-letter-top-right"></span>
              <span class="absolute text-[6rem] font-black leading-none text-white"
                    style="top: 40%; left: 50%; transform: translate(-50%, -50%)"
                    id="card-letter"></span>
            </div>
            <!-- Lightning bolts in white bottom-right corner -->
            <div class="absolute bottom-4 right-3 flex gap-0.5 leading-none">
              <span class="text-[#f4c430] text-2xl">⚡</span>
              <span class="text-[#f4c430] text-2xl">⚡</span>
            </div>
          </div>

          <!-- Front face: prompt -->
          <div class="card-face card-front-face border-4 border-white/35">
            <p class="text-2xl font-black text-white text-center leading-snug" id="card-question"></p>
          </div>

        </div>
      </div>
    </div>

    <!-- Hint text -->
    <p id="hint" class="mt-8 text-blue-700 text-sm font-bold animate-pulse">Tap to flip</p>

    <!-- Word counter – always visible below the card -->
    <div id="counter" class="counter-number text-blue-700 font-black mt-1"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex-col items-center justify-center text-center px-6">
      <p class="text-6xl mb-4">🎉</p>
      <h2 class="text-3xl font-black text-[#0b1f5e] mb-2">That's all!</h2>
      <p class="text-blue-700 mb-8">You went through the whole deck.</p>
      <button onclick="location.reload()"
              class="bg-yellow-300 text-gray-900 font-black text-lg px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition-transform">
        Play again
      </button>
    </div>

  </main>

  <!-- Footer: remaining cards -->
  <footer class="w-full text-center py-2">
    <p class="text-blue-700 text-base">
      <span id="remaining">0</span> cards remaining
    </p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
