<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickStop!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#0b1f5e] flex flex-col items-center justify-between p-6 select-none">

  <!-- Header -->
  <header class="w-full text-center mt-2">
    <h1 class="text-4xl font-black text-white tracking-wide drop-shadow-lg">
      Quick<span class="text-yellow-200">Stop!</span>
    </h1>
    <p class="text-blue-200 text-sm mt-1">Name something that starts with the letter</p>
  </header>

  <!-- Card area -->
  <main class="flex-1 flex flex-col items-center justify-center w-full">

    <!-- Pile wrapper – shadow cards are inserted here by JS -->
    <div id="pile-wrapper" class="relative flex items-center justify-center"
         style="width: 280px; height: 380px;">

      <!-- The actual card scene (3-D flip container) -->
      <div id="card-scene" class="card-scene absolute inset-0 cursor-pointer" tabindex="0"
           style="width: 280px; height: 380px;">
        <div id="card" class="card-inner w-full h-full drop-shadow-2xl">

          <!-- Back face: letter -->
          <div class="card-face card-back-face border-4 border-white/35 relative">
            <span class="absolute top-4 left-4 text-white text-2xl font-black leading-none" id="card-letter-top-left"></span>
            <span class="absolute top-4 right-4 text-white text-2xl font-black leading-none" id="card-letter-top-right"></span>
            <span class="text-[10rem] font-black leading-none drop-shadow-lg" id="card-letter"></span>
          </div>

          <!-- Front face: prompt -->
          <div class="card-face card-front-face border-4 border-white/35">
            <p class="text-3xl font-black text-white text-center leading-snug" id="card-question"></p>
          </div>

        </div>
      </div>
    </div>

    <!-- Hint text -->
    <p id="hint" class="mt-8 text-blue-200 text-sm font-bold animate-pulse">Tap to flip</p>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex-col items-center justify-center text-center px-6">
      <p class="text-6xl mb-4">🎉</p>
      <h2 class="text-3xl font-black text-white mb-2">That's all!</h2>
      <p class="text-blue-200 mb-8">You went through the whole deck.</p>
      <button onclick="location.reload()"
              class="bg-yellow-300 text-gray-900 font-black text-lg px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition-transform">
        Play again
      </button>
    </div>

  </main>

  <!-- Footer: remaining cards -->
  <footer class="w-full text-center pb-2">
    <p class="text-blue-300 text-sm">
      <span id="remaining">0</span> cards remaining
    </p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
